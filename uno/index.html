<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2430">
<title>Uno</title>
<style>
  :root { --bg: #1d2430; --ink: #f2f4f7; --soft: #9aa5b5; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px 16px; }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 8px; }
  p { color: var(--soft); margin: 0 0 24px; max-width: 320px; }
  a { display: inline-block; min-height: 48px; line-height: 48px; padding: 0 24px; border-radius: 14px; background: #2f74d0; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<h1>Uno</h1>
<p>Het spel komt eraan. Het spelregels-deel is klaar; het scherm wordt nu gebouwd.</p>
<a href="../">Terug naar Mijn spellen</a>
</body>
</html>
