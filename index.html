<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Mijn spellen</title>
<link rel="manifest" href="hub.webmanifest">
<link rel="icon" href="icons/spellen.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/spellen-192.png">
<style>
  :root { --bg: #f4f6f8; --card: #ffffff; --ink: #1d2430; --soft: #5b6676; --line: #dfe4ea; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #13171d; --card: #1c222b; --ink: #f2f4f7; --soft: #9aa5b5; --line: #2a323d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100dvh; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px env(safe-area-inset-bottom, 0px); }
  header { padding: 8px 4px 20px; }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--soft); font-size: 15px; }
  main { display: flex; flex-direction: column; gap: 14px; }
  a.game { display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 2px 10px rgba(20,30,45,.06); }
  a.game:active { transform: scale(.985); }
  .band { height: 110px; display: flex; align-items: center; justify-content: center; }
  .band img { width: 76px; height: 76px; border-radius: 20px; background: rgba(255,255,255,.12); padding: 4px; }
  .poker .band { background: #b3261e; }
  .toepen .band { background: #1e7a4c; }
  .uno .band { background: #2b2f3a; }
  .uno .band svg { width: 76px; height: 76px; border-radius: 20px; }
  .info { padding: 16px 18px 18px; }
  .info b { display: block; font-size: 21px; font-weight: 800; }
  .info span { display: block; color: var(--soft); font-size: 15px; margin-top: 4px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .poker .band { background: #8f1f18; } }
</style>
</head>
<body>
<header>
  <h1>Mijn spellen</h1>
  <p>Kies een spel om te openen</p>
</header>
<main>
  <a class="game poker" href="poker/">
    <div class="band"><img src="poker/icons/icon-192.png" alt=""></div>
    <div class="info"><b>Royal Flush Society</b><span>Texas Hold'em met speelgeld.</span></div>
  </a>
  <a class="game toepen" href="toepen/">
    <div class="band"><img src="toepen/icons/icon-192.png" alt=""></div>
    <div class="info"><b>Toepen</b><span>Kaartspel, alleen of met vrienden.</span></div>
  </a>
  <a class="game uno" href="uno/">
    <div class="band"><svg viewBox="0 0 76 76" aria-hidden="true"><rect width="76" height="76" rx="20" fill="#1d2430"/><rect x="8" y="8" width="30" height="30" rx="6" fill="#d7372c"/><rect x="38" y="8" width="30" height="30" rx="6" fill="#f2b531"/><rect x="8" y="38" width="30" height="30" rx="6" fill="#2fa35a"/><rect x="38" y="38" width="30" height="30" rx="6" fill="#2f74d0"/></svg></div>
    <div class="info"><b>Uno</b><span>Het kaartspel met kleuren, tegen de computer of met vrienden.</span></div>
  </a>
</main>
<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('hub-sw.js'); });
</script>
</body>
</html>
